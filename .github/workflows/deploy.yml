name: 🚀 Deploy Nextal Academy to Hostinger (SSH)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy via SSH Password
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source code ──────────────────────────────────────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ─────────────────────────────────────────────────
      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Cache npm (speeds up subsequent runs) ──────────────────────────
      - name: 📦 Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # ── 4. Install dependencies ───────────────────────────────────────────
      - name: 🔧 Install Dependencies
        run: npm ci

      # ── 5. Build the Vite project ─────────────────────────────────────────
      - name: 🏗️ Build Project
        run: npm run build

      # ── 6. Install sshpass (needed for password-based SSH auth) ──────────
      - name: 🔧 Install sshpass
        run: sudo apt-get install -y sshpass

      # ── 7. Deploy via rsync with SSH password ────────────────────────────
      - name: 🌐 Deploy via rsync
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            ./dist/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/u838392794/public_html/
